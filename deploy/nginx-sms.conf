# SOP §27.1 - Nginx vhost. Replace sms.example.com and the PHP-FPM socket if needed.
server {
    listen 80;
    server_name sms.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name sms.example.com;

    ssl_certificate     /etc/letsencrypt/live/sms.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sms.example.com/privkey.pem;
    # Enable HSTS only after a week of stable operation:
    # add_header Strict-Transport-Security "max-age=31536000" always;

    root /var/www/sms/current/public;
    index index.php;

    client_max_body_size 8M;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # No PHP execution inside uploads, no dotfiles.
    location ~* ^/storage/.*\.php$ { deny all; }
    location ~ /\.(?!well-known) { deny all; }
}
